services:
  api-gw:
    # Local dashboard access only; Cloudflare reaches the private edge service.
    ports: !override
      - "127.0.0.1:8000:8000"

  supavisor:
    ports: !override []

  journal-api:
    build:
      context: ../Journal-api
    restart: unless-stopped
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      AUTH_USER_URL: "http://auth:9999/user"
      OPENAI_API_KEY_FILE: "/run/secrets/journal_openai_key"
    secrets:
      - journal_openai_key
    depends_on:
      auth:
        condition: service_healthy

  journal-edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./journal-edge.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api-gw
      - journal-api

  journal-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/journal_tunnel_token
    secrets:
      - journal_tunnel_token
    depends_on:
      - journal-edge

secrets:
  journal_openai_key:
    file: ./secrets/openai-api-key
  journal_tunnel_token:
    file: ./secrets/cloudflare-tunnel-token
